name: "Lógica"
version: "0.10.1"
slug: loxone_logic
description: "Bloques de lógica para Home Assistant con editor visual y app por habitaciones"
url: "https://github.com/"
arch: [amd64, aarch64]
startup: application
boot: auto
init: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:graph-outline
panel_title: "Lógica"
panel_admin: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Editor (acceso directo opcional, sin ingress)"
options:
  arrancar_activo: false
  inicio: editor
schema:
  arrancar_activo: bool
  inicio: list(editor|app)
