<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lógica — Editor de programación</title>
<style>
:root{
  --chrome:#f0f1f2; --chrome2:#e3e6e8; --chrome3:#d6dadd; --line:#c2c8cd; --text:#24292d; --mute:#69727a;
  --canvas:#fcfcfc; --grid:#dde1e4; --acc:#69c350; --accd:#4a9a35; --acct:#e8f6e3;
  --blk:#ffffff; --blkh:#eceff1; --blkb:#8b949b; --sel:#2a7fd4; --pin:#ffffff; --wire:#8a949b; --hot:#2fa84f; --ana:#2a7fd4;
  --in:#dff3d8; --inb:#69c350; --out:#ffe7c7; --outb:#e29a2f; --note:#fff6c2; --bad:#d9483b; --warn:#d68a12;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --chrome:#2b2f33; --chrome2:#23272a; --chrome3:#32373b; --line:#41474d; --text:#e4e7ea; --mute:#8d97a0;
  --canvas:#1b1e21; --grid:#2b3035; --acct:#26402a;
  --blk:#2c3135; --blkh:#353b40; --blkb:#6c767e; --pin:#1b1e21; --wire:#7d878f;
  --in:#24402a; --out:#4a3a1e; --note:#4c4724;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--text);font:12.5px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--blk);border:1px solid var(--line);border-radius:3px;padding:3px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--sel);border-color:var(--sel)}
#app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100%}

/* título */
#title{display:flex;align-items:center;gap:10px;padding:3px 10px;background:var(--chrome2);border-bottom:1px solid var(--line);font-size:12px}
#title b{font-weight:600} #title .logo{width:14px;height:14px;background:var(--acc);border-radius:3px;display:inline-block}
#title .sp,#status .sp{flex:1}
#title .mut{color:var(--mute)}

/* cinta */
#tabs{display:flex;background:var(--chrome2);padding:0 6px;gap:2px;border-bottom:1px solid var(--line)}
#tabs button{border:0;background:none;padding:5px 14px;cursor:pointer;border-radius:3px 3px 0 0;color:var(--mute)}
#tabs button.on{background:var(--chrome);color:var(--text);box-shadow:inset 0 2px var(--acc)}
#ribbon{display:flex;background:var(--chrome);border-bottom:1px solid var(--line);min-height:68px;padding:4px 6px;gap:2px;align-items:stretch}
.grp{display:flex;gap:2px;padding:0 6px;border-right:1px solid var(--line);position:relative;padding-bottom:14px}
.grp:last-child{border-right:0}
.grp>span.gl{position:absolute;bottom:0;left:0;right:0;text-align:center;color:var(--mute);font-size:10.5px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:52px;padding:3px 6px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;color:var(--text)}
.rb:hover:not(:disabled){background:var(--chrome3);border-color:var(--line)}
.rb:disabled{opacity:.4;cursor:default}
.rb i{font-style:normal;font-size:20px;line-height:22px}
.rb.on{background:var(--acct);border-color:var(--acc)}
.rb.warn{color:var(--warn)} .rb.act{background:#f7d3ce;border-color:var(--bad);color:#8a2018}
[data-theme=dark] .rb.act{background:#5a2620;color:#ffd5cf}

/* cuerpo */
#main{display:grid;grid-template-columns:var(--wl,270px) 4px 1fr 4px var(--wr,290px);min-height:0}
.dock{background:var(--chrome);display:flex;flex-direction:column;min-height:0;min-width:0}
.dh{padding:4px 8px;background:var(--chrome2);border-bottom:1px solid var(--line);font-weight:600;font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
.dh button{border:0;background:none;cursor:pointer;color:var(--mute)}
.split{background:var(--chrome3);cursor:col-resize}
.split:hover{background:var(--acc)}
#treewrap{overflow:auto;flex:1;padding:2px 0}
.tn{display:flex;align-items:center;gap:5px;padding:2px 6px 2px calc(6px + var(--d,0)*14px);cursor:default;white-space:nowrap;min-width:0}
.tn:hover{background:var(--chrome3)}
.tn.sel{background:var(--acct);box-shadow:inset 2px 0 var(--acc)}
.tn .ar{width:10px;color:var(--mute);font-size:9px;flex:none;cursor:pointer}
.tn .tx{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tn .bd{color:var(--mute);font-size:10.5px;flex:none}
.tn a{color:inherit}
.tn.leaf{cursor:grab}
.tn.used .tx{font-weight:600} .tn.used::after{content:"●";color:var(--acc);font-size:8px}
.tn .ic{width:12px;height:12px;border-radius:2px;flex:none}
.ic.in{background:var(--inb)} .ic.out{background:var(--outb)} .ic.bk{background:var(--blkb)} .ic.pg{background:var(--sel)} .ic.ha{background:#41bdf5}
.stub::after{content:" stub";color:var(--warn);font-size:10px}
#tsearch{margin:4px 6px;width:calc(100% - 12px)}

/* centro */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chrome)}
#ptabs{display:flex;background:var(--chrome2);border-bottom:1px solid var(--line);overflow-x:auto;min-height:26px}
.pt{padding:4px 12px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--mute);display:flex;gap:6px;align-items:center}
.pt.on{background:var(--canvas);color:var(--text);box-shadow:inset 0 -2px var(--acc)}
.pt button{border:0;background:none;color:var(--mute);cursor:pointer;padding:0 2px}
#view{position:relative;overflow:hidden;flex:1;background:var(--canvas);cursor:default}
#grid{position:absolute;inset:0;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
svg#wires path{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linejoin:round;pointer-events:none}
svg#wires path.hit{stroke:transparent;stroke-width:9;pointer-events:stroke;cursor:pointer}
svg#wires path.v1{stroke:var(--hot);stroke-width:2.2} svg#wires path.va{stroke:var(--ana);stroke-width:2}
svg#wires path.selw{stroke:var(--sel);stroke-width:3}
svg#wires path.tmp{stroke:var(--sel);stroke-dasharray:4 3}
.ob{position:absolute;user-select:none}
.blk{min-width:132px;background:var(--blk);border:1px solid var(--blkb);border-radius:3px;box-shadow:0 1px 3px #0002}
.blk.sel,.pnode.sel,.note.sel{outline:2px solid var(--sel);outline-offset:1px}
.blk .h{background:var(--blkh);border-bottom:1px solid var(--blkb);padding:3px 8px 3px 10px;cursor:move;border-left:4px solid var(--cc,#aaa);border-radius:2px 2px 0 0;display:flex;flex-direction:column}
.blk .h b{font-weight:600;white-space:nowrap}
.blk .h small{color:var(--mute);font-size:10.5px;white-space:nowrap}
.blk.stubb{border-style:dashed}
.blk .bd{display:flex;justify-content:space-between;gap:14px;padding:4px 0}
.col{display:flex;flex-direction:column;gap:2px}
.pr{display:flex;align-items:center;gap:5px;height:19px;padding:0 6px;font-family:var(--mono);font-size:11px;white-space:nowrap}
.pr.o{justify-content:flex-end}
.pin{width:9px;height:9px;background:var(--pin);border:1.5px solid var(--blkb);flex:none;cursor:crosshair}
.pin:hover,.pin.hl{background:var(--acc);border-color:var(--accd)}
.pin.cn{background:var(--acc);border-color:var(--accd)}
.pr.i .pin{margin-left:-11px} .pr.o .pin{margin-right:-11px}
.pr .lb{cursor:pointer} .pr .lb:hover{color:var(--sel);text-decoration:underline}
.cv{background:var(--acct);border:1px solid var(--acc);padding:0 4px;border-radius:2px;font-size:10px}
.lv{color:var(--sel);font-size:10px;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.lv.t{color:var(--hot);font-weight:600}
.pnode{display:flex;align-items:center;height:26px;min-width:170px;padding:0 10px;cursor:move;font-size:12px;border:1px solid;gap:8px}
.pnode.in{background:var(--in);border-color:var(--inb);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);padding-right:20px}
.pnode.out{background:var(--out);border-color:var(--outb);clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);padding-left:20px}
.pnode .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.pnode small{color:var(--mute);font-size:10px}
.pnwrap .pin{position:absolute;top:8px;margin:0}
.pnwrap.in .pin{right:-5px} .pnwrap.out .pin{left:-5px}
.pnwrap{position:absolute}
.note{background:var(--note);border:1px solid #d6c64d;padding:6px 8px;min-width:120px;min-height:40px;font-size:12px;cursor:move;white-space:pre-wrap;box-shadow:1px 1px 3px #0002}
#band{position:absolute;border:1px dashed var(--sel);background:#2a7fd422;display:none;pointer-events:none}
#zoomc{position:absolute;right:12px;bottom:10px;display:flex;gap:2px;background:var(--chrome);border:1px solid var(--line);border-radius:4px;padding:2px}
#zoomc button{border:0;background:none;padding:2px 8px;cursor:pointer}
#zoomc button:hover{background:var(--chrome3)}
#empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--mute);text-align:center;pointer-events:none}

/* propiedades */
#props{overflow:auto;flex:1;padding:0}
.ph{background:var(--chrome2);padding:3px 8px;font-weight:600;font-size:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
table.pt2{width:100%;border-collapse:collapse}
table.pt2 td{padding:2px 6px;border-bottom:1px solid var(--chrome2);vertical-align:middle}
table.pt2 td:first-child{width:46%;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
table.pt2 input,table.pt2 select{width:100%;border-color:transparent;background:transparent}
table.pt2 input:hover,table.pt2 input:focus{border-color:var(--line);background:var(--blk)}
.help{padding:6px 8px;color:var(--mute);font-size:11.5px;border-top:1px solid var(--line)}
.help a{color:var(--sel)}
.pbtn{margin:8px;padding:4px 10px;border:1px solid var(--line);background:var(--chrome2);cursor:pointer;border-radius:3px}
.pbtn:hover{background:var(--chrome3)} .pbtn.d{color:var(--bad)}
.hint0{padding:12px;color:var(--mute)}

/* inferior */
#bottom{background:var(--chrome);border-top:1px solid var(--line);display:flex;flex-direction:column;height:var(--hb,150px);min-height:0}
#bottom.min{height:26px}
.bt{display:flex;background:var(--chrome2);border-bottom:1px solid var(--line)}
.bt button{border:0;background:none;padding:3px 12px;cursor:pointer;color:var(--mute)}
.bt button.on{color:var(--text);box-shadow:inset 0 -2px var(--acc)}
.bt .sp{flex:1}
#bcont{overflow:auto;flex:1;font-family:var(--mono);font-size:11.5px;user-select:text}
#bcont div{padding:1px 10px;border-bottom:1px solid var(--chrome2);white-space:nowrap}
.sent{color:var(--hot)} .sim{color:var(--warn)} .er{color:var(--bad)}
#status{display:flex;align-items:center;gap:14px;background:var(--chrome3);padding:2px 10px;font-size:11.5px;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block;margin-right:5px}
.dot.ok{background:var(--hot)} .dot.bad{background:var(--bad)}
.mode{padding:0 8px;border-radius:2px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
.mode.sim{color:var(--warn);border-color:var(--warn)} .mode.act{background:var(--bad);color:#fff;border-color:var(--bad)}

/* diálogos y menús */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
#modal .box{background:var(--chrome);border:1px solid var(--line);border-radius:5px;width:min(760px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0007}
#modal .mh{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#modal .mh input{flex:1;padding:5px 8px}
#modal .mb{display:grid;grid-template-columns:200px 1fr;min-height:0;flex:1;overflow:hidden}
#modal .mc{overflow:auto;border-right:1px solid var(--line)} #modal .ml{overflow:auto}
#modal .it{padding:4px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#modal .it:hover,#modal .it.on{background:var(--acct)}
#modal .it small{color:var(--mute)}
#ctx{position:fixed;background:var(--chrome);border:1px solid var(--line);box-shadow:0 4px 14px #0004;z-index:60;display:none;min-width:150px;padding:2px 0}
#ctx div{padding:4px 14px;cursor:pointer} #ctx div:hover{background:var(--acct)}
#toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:var(--accd);color:#fff;padding:6px 14px;border-radius:4px;display:none;z-index:70}
#toast.bad{background:var(--bad)}
#ac{position:absolute;z-index:30;background:var(--chrome);border:1px solid var(--line);max-height:220px;overflow:auto;display:none;box-shadow:0 4px 14px #0004;left:0;right:0}
#ac div{padding:3px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px} #ac div:hover{background:var(--acct)} #ac small{color:var(--mute)}
#pop{position:fixed;z-index:65;background:var(--chrome);border:1px solid var(--sel);border-radius:4px;padding:6px;display:none;width:190px}
#pop input{width:100%} #pop .doc{font-size:10.5px;color:var(--mute);margin-top:3px}
</style>
</head>
<body data-theme="light">
<div id="app">
  <div id="title"><span class="logo"></span><b>Lógica</b><span class="mut">·</span><span id="pname">proyecto.json</span><span id="dirty" class="mut"></span><span class="sp"></span><span class="mut">Editor de programación para Home Assistant</span></div>
  <div id="tabs"></div>
  <div id="ribbon"></div>

  <div id="main">
    <div class="dock" id="dl">
      <div class="dh">Proyecto <span><button id="tcol" title="Contraer todo">⊟</button></span></div>
      <input id="tsearch" placeholder="Filtrar entidades, bloques y páginas…">
      <div id="treewrap"></div>
    </div>
    <div class="split" id="sl"></div>

    <div id="center">
      <div id="ptabs"></div>
      <div id="view">
        <canvas id="grid"></canvas>
        <div id="world"><svg id="wires"></svg></div>
        <div id="band"></div>
        <div id="empty">Arrastra bloques y entidades desde el árbol de la izquierda<br><small>o usa Programación → Insertar bloque (Ctrl+B)</small></div>
        <div id="zoomc"><button id="zo">−</button><button id="zr" title="100%">100%</button><button id="zi">+</button><button id="zf" title="Encuadrar">⛶</button></div>
      </div>
    </div>

    <div class="split" id="sr"></div>
    <div class="dock" id="dr">
      <div class="dh">Propiedades</div>
      <div id="props"></div>
    </div>
  </div>

  <div id="bottom">
    <div class="bt"><button data-b="log" class="on">Registro de órdenes</button><button data-b="msg">Mensajes</button><button data-b="mon">Monitor de valores</button><span class="sp"></span><button id="bmin" title="Mostrar / ocultar">▾</button></div>
    <div id="bcont"></div>
  </div>
  <div id="status">
    <span><span class="dot" id="sdot"></span><span id="sst">Conectando…</span></span>
    <span id="scyc">ciclos 0</span>
    <span id="smode" class="mode sim" title="Pulsa para cambiar entre simulación y activo">SIMULACIÓN</span>
    <span class="sp"></span>
    <span id="spage"></span><span id="szoom">100%</span>
    <span id="stheme" style="cursor:pointer" title="Cambiar tema">◐ Tema</span>
  </div>
</div>

<div id="modal"><div class="box"><div class="mh"><b id="mt">Insertar bloque</b><input id="mq" placeholder="Buscar…"><button id="mx">✕</button></div><div class="mb"><div class="mc" id="mc"></div><div class="ml" id="ml"></div></div></div></div>
<div id="ctx"></div><div id="toast"></div>
<div id="pop"><input id="popi"><div class="doc">Enter = aplicar · vacío = quitar</div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,m="GET",b)=>{const r=await fetch(p,{method:m,body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
const G=12, snap=v=>Math.round(v/G)*G;
const lsGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

let CAT={}, ENT=[], live=null, dirty=false, cur="p1", sel=new Set(), view={x:60,y:40,k:1}, nextId=1, bottomTab="log", ribTab="proyecto";
let S={pages:[{id:"p1",name:"Página 1"}],nodes:[],pn:[],notes:[],wires:[],consts:{},settings:{}};
const catColor=c=>{let h=0;for(const ch of c||"")h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 45% 52%)`};
const msgs=[]; const msg=(t,bad)=>{msgs.unshift({t:new Date().toLocaleTimeString("es-ES"),m:t,bad});msgs.length=Math.min(msgs.length,100);if(bottomTab==="msg")drawBottom()};

/* ---------- puertos ---------- */
function expand(abbr,max=8){
  if(abbr.startsWith("("))return [];
  const m=abbr.match(/^(\D+?)(\d+)-(\d+)$/);
  if(m){const a=+m[2],b=+m[3],o=[];for(let n=a;n<=Math.min(b,a+max-1);n++)o.push(m[1]+n);return o}
  return [abbr];
}
let showHidden=lsGet("showHidden","0")==="1";
function applyUI(b){const u=b.ui||{};b.orig=b.name;if(u.name)b.name=u.name;if(u.category)b.category=u.category;if(u.desc)b.descripcion=u.desc;b.hidden=!!u.hide;
  const f=(arr,m)=>(arr||[]).forEach(p=>{const o=m?.[p.abbr];if(o){p.orig=p.name;if(o.label)p.lab=o.label;if(o.desc)p.desc=o.desc;p.hide=!!o.hide}});
  f(b.inputs,u.inputs);f(b.outputs,u.outputs);f(b.parameters,u.params)}
const numOf=a=>(a.match(/(\d+)$/)||[])[1]||"";
const plabel=(abbr,def)=>def.lab?def.lab.replace(/\{n\}/g,numOf(abbr)):abbr;
const ptip=(abbr,def)=>`${plabel(abbr,def)}${plabel(abbr,def)!==abbr?"  ("+abbr+")":""}${def.range?" ["+def.range+"]":""}\n${def.desc||""}`;
const visible=p=>showHidden||!p.def.hide;
const insOf=t=>(CAT[t]?.inputs||[]).flatMap(p=>expand(p.abbr).map(a=>({abbr:a,def:p}))).filter(visible);
const outsOf=t=>(CAT[t]?.outputs||[]).flatMap(p=>expand(p.abbr).map(a=>({abbr:a,def:p}))).filter(visible);
const obj=id=>S.nodes.find(n=>n.id===id)||S.pn.find(n=>n.id===id)||S.notes.find(n=>n.id===id);
const pageOf=id=>obj(id)?.page;

/* ---------- modelo <-> proyecto ---------- */
function fromProject(p){
  S={pages:p.pages?.length?p.pages:[{id:"p1",name:"Página 1"}],nodes:[],pn:[],notes:[],wires:[],consts:{},settings:p.settings||{}};
  const ui=p.ui||{}, pg0=S.pages[0].id;
  p.blocks.forEach((b,i)=>S.nodes.push({id:b.id,type:b.type,name:b.name||"",params:b.params||{},config:b.config||null,
    x:ui[b.id]?.x??(60+(i%4)*288),y:ui[b.id]?.y??(60+Math.floor(i/4)*264),page:ui[b.id]?.page||pg0}));
  (p.wires||[]).forEach(([a,b])=>{const [fa,fp]=a.split(/\.(.+)/),[ta,tp]=b.split(/\.(.+)/);S.wires.push({f:fa,fp,t:ta,tp})});
  Object.entries(p.consts||{}).forEach(([k,v])=>S.consts[k]=v);
  S.notes=(p.notes||[]).map(n=>({...n,page:n.page||pg0}));
  if(p.ha_nodes){
    S.pn=p.ha_nodes.map(n=>({...n,page:n.page||pg0}));
    (p.ha_wires||[]).forEach(w=>S.wires.push({...w}));
  }else{ // proyecto antiguo / escrito a mano: reconstruye desde la periferia
    const inG={}; let cy=40;
    (p.periphery||[]).forEach(q=>{
      const [tb,tpt]=q.target.split(/\.(.+)/);
      if(q.dir==="in"){const key=q.name+"|"+q.entity+"|"+(q.attribute||"");let pn=inG[key];
        if(!pn){pn={id:"ha"+(nextId++),dir:"in",name:q.name,entity:q.entity,attribute:q.attribute||"",adapt:q.adapt||{},x:-300,y:(cy+=72),page:pageOf(tb)||pg0};inG[key]=pn;S.pn.push(pn)}
        S.wires.push({f:pn.id,fp:"v",t:tb,tp:tpt});
      }else{const pn={id:"ha"+(nextId++),dir:"out",name:q.name,entity:q.entity,attribute:"",service:q.service||"",adapt:q.adapt||{},service_data:q.service_data||null,service_when:q.service_when||"",x:900,y:(cy+=72),page:pageOf(tb)||pg0};

    b.querySelectorAll("input[data-p]").forEach(i=>i.onchange=()=>{const t=i.value.trim(),k=i.dataset.p;if(t==="")delete n.params[k];else{const v=Number(t.replace(",","."));n.params[k]=isNaN(v)?t:v}touch()})}
  b.insertAdjacentHTML("beforeend",`<div class="ph">Configuración avanzada (JSON)</div><div style="padding:4px 6px"><textarea id="pcfg" rows="4" style="width:100%" placeholder='opcional; en avisos: {"service":"notify.mobile_app_x","title":"Alarma","message":"Valor <v1>"}'>${n.config?esc(JSON.stringify(n.config,null,1)):""}</textarea></div>`);
  $("#pcfg").onchange=e=>{const t=e.target.value.trim();try{n.config=t?JSON.parse(t):null;e.target.style.borderColor="";touch()}catch(x){e.target.style.borderColor="var(--bad)"}};
  const d=(l,a)=>{a=a.filter(x=>showHidden||!x.hide);return a.length?`<b>${l}</b><br>`+a.map(x=>`<code>${esc(x.abbr)}</code> ${esc(x.lab||x.name||"")}${x.range?` [${esc(x.range)}]`:""}${x.desc?`<br><span style="color:var(--mute)">${esc(x.desc)}</span>`:""}`).join("<br>")+"<br><br>":""};
  b.insertAdjacentHTML("beforeend",`<div class="ph">Ayuda</div><div class="help" style="user-select:text">${esc(c.descripcion||"")}${c.impl==="stub"?'<br><br><b style="color:var(--warn)">Sin lógica propia:</b> depende de hardware o de un servicio externo; el motor solo mantiene sus entradas/salidas.':""}<br><br>${d("Entradas",c.inputs||[])}${d("Salidas",c.outputs||[])}${c.notas?esc(c.notas)+"<br><br>":""}${c.url?`<a target="_blank" href="${esc(c.url)}">Referencia original ↗</a>`:""}</div>`);
  const del=el("button","pbtn d","Eliminar bloque");del.onclick=delSel;b.appendChild(del);
}
function entityPicker(input,onpick,outOnly){
  const wrap=input.parentElement;wrap.style.position="relative";const ac=el("div");ac.id="ac";wrap.appendChild(ac);
  const show=()=>{const q=input.value.toLowerCase();ac.innerHTML="";const l=ENT.filter(e=>(!outOnly||OUT_DOM.has(e.domain))&&(!q||(e.id+e.name).toLowerCase().includes(q))).slice(0,40);
    l.forEach(e=>{const d=el("div","",`<span>${esc(e.name)}</span><small>${esc(e.id)}</small>`);d.onmousedown=()=>{input.value=e.id;ac.style.display="none";onpick(e)};ac.appendChild(d)});ac.style.display=l.length?"block":"none"};
  input.onfocus=input.oninput=show;input.onblur=()=>setTimeout(()=>ac.style.display="none",150);
}
const PROF_IN=[
 ["Automático (estado de la entidad)",{attribute:"",adapt:{fallback:0}},"on/off, abierto/cerrado, home… se convierten a 1/0; los números pasan tal cual."],
 ["Pulsador / mando (evento)",{attribute:"",adapt:{pulse:true,equals:"single,press,short_press,toggle,1_click"}},"Da un pulso de 1 ciclo cada vez que el estado cambia a uno de esos textos. Ajusta la lista a tu dispositivo."],
 ["Sensor numérico (temperatura, potencia…)",{attribute:"",adapt:{fallback:0}},"Pasa el número tal cual; si no está disponible usa 0."],
 ["Persiana: posición (0 abierta … 100 cerrada)",{attribute:"current_position",adapt:{scale:[0,100,100,0],fallback:0}},"HA usa 100 = abierta; el motor usa 100 = cerrada, por eso se invierte."],
 ["Luz: brillo %",{attribute:"brightness",adapt:{scale:[0,255,0,100],fallback:0}},"Convierte el brillo 0–255 de HA a 0–100 %."],
 ["Clima: temperatura actual",{attribute:"current_temperature",adapt:{}},""],
 ["Clima: consigna actual",{attribute:"temperature",adapt:{}},""],
 ["Activo cuando el estado es…",{attribute:"",adapt:{equals:"",fallback:0}},"Escribe el texto en «Activo cuando =» (p.ej. playing, heat, armed_away)."],
];
const PROF_OUT=[
 ["Automático según el dominio",{service:"",service_data:null,service_when:"",adapt:{}},"light/switch: encender-apagar (la luz admite 0-100 % como brillo); cover: posición; climate: consigna; scene/script/button: se ejecutan al activarse…"],
 ["Persiana: posición (0 abierta … 100 cerrada)",{service:"",service_data:null,service_when:"",adapt:{scale_out:[0,100,100,0]}},"Convierte al 0–100 de HA (100 = abierta)."],
 ["Persiana: abrir (con pulso)",{service:"cover.open_cover",service_data:null,service_when:"rise",adapt:{}},""],
 ["Persiana: cerrar (con pulso)",{service:"cover.close_cover",service_data:null,service_when:"rise",adapt:{}},""],
 ["Persiana: parar (con pulso)",{service:"cover.stop_cover",service_data:null,service_when:"rise",adapt:{}},""],
 ["Alternar (toggle) con pulso",{service:"homeassistant.toggle",service_data:null,service_when:"rise",adapt:{}},"Sirve para cualquier entidad que se pueda alternar."],
 ["Volumen del reproductor (0-100 %)",{service:"media_player.volume_set",service_data:{volume_level:"{v}"},service_when:"",adapt:{scale_out:[0,100,0,1]}},""],
 ["Servicio personalizado",{},"Rellena «Servicio» (dominio.servicio) y los datos en JSON; {v} se sustituye por el valor del bloque."],
];
function haProps(b,p){
  const isIn=p.dir==="in",a=p.adapt||(p.adapt={}),P=isIn?PROF_IN:PROF_OUT;
  const dsj=p.service_data?JSON.stringify(p.service_data):"";
  b.innerHTML=`<div class="ph">${isIn?"Entrada de Home Assistant":"Salida de Home Assistant"}</div>`+tbl([
    ["Entidad",`<input id="pe" value="${esc(p.entity)}" placeholder="light.salon">`],["Nombre",`<input id="pnm" value="${esc(p.name)}">`],
    ["Perfil",`<select id="ppf"><option value="-1">— elegir para rellenar —</option>${P.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join("")}</select>`,"Rellena los campos de abajo para el tipo de dispositivo"],
    ...(isIn?[["Atributo",`<input id="pat" value="${esc(p.attribute||"")}" placeholder="vacío = estado">`,"Si lo rellenas, lee ese atributo (p.ej. temperature)"]]
      :[["Servicio",`<input id="psv" value="${esc(p.service||"")}" placeholder="auto">`,"dominio.servicio; vacío = según el dominio"],
        ["Datos (JSON)",`<input id="psd" value="${esc(dsj)}" placeholder='{"campo":"{v}"}'>`,"Datos extra del servicio; {v} = valor del bloque"],
        ["Enviar",`<select id="psw"><option value="">cada cambio</option><option value="rise" ${p.service_when==="rise"?"selected":""}>solo al activarse (0→1)</option></select>`]])])+
   `<div class="ph">Adaptación</div>`+tbl([["Invertir 0↔1",`<input type="checkbox" id="pinv" ${a.invert?"checked":""}>`],
    ...(isIn?[["Activo cuando = ",`<input id="peq" value="${esc(a.equals??"")}" placeholder="p.ej. single,double" >`,"Vale 1 solo cuando el estado es uno de estos textos (separa con comas)"],
      ["Pulso de 1 ciclo",`<input type="checkbox" id="ppu" ${a.pulse?"checked":""}>`,"Para pulsadores: se activa un ciclo cada vez que llega el evento y vuelve a 0"],
      ["Si no disponible",`<input id="pfb" value="${a.fallback??""}" placeholder="sin valor">`]]:[]),
    ["Escalado",`<input id="psc" value="${esc(JSON.stringify(isIn?a.scale||"":a.scale_out||"").replace(/^""$/,""))}" placeholder="[e0,e1,s0,s1]">`,"[entrada0, entrada1, salida0, salida1]"]])+
   `<div class="help" id="phelp">${isIn?"Lee el estado de la entidad y lo entrega al bloque conectado.":"Cuando cambia el valor del bloque, llama al servicio de HA de la entidad."}<br><br><b>Convenciones del motor</b><br>Digital: 0 / 1. Analógico: valor real. Persianas: 0 = abierta … 100 = cerrada. Un cambio de estado de HA se ve en el siguiente ciclo (1 s).</div>`;
  entityPicker($("#pe"),e=>{p.entity=e.id;if(!p.name||p.name===p.entity)p.name=e.name;touch();fullRender()},!isIn);
  $("#pe").onchange=e=>{p.entity=e.target.value.trim();touch();fullRender()};$("#pnm").onchange=e=>{p.name=e.target.value;touch();fullRender()};
  $("#ppf").onchange=e=>{const i=+e.target.value;if(i<0)return;const [,v,h]=P[i];
    if(isIn){p.attribute=v.attribute??p.attribute;p.adapt=JSON.parse(JSON.stringify(v.adapt||{}))}
    else{p.service=v.service??p.service;p.service_data=v.service_data??null;p.service_when=v.service_when??"";p.adapt=JSON.parse(JSON.stringify(v.adapt||{}))}
    touch();drawProps();$("#phelp").insertAdjacentHTML("afterbegin",h?`<b style="color:var(--acc)">${esc(h)}</b><br><br>`:"")};
  if($("#pat"))$("#pat").onchange=e=>{p.attribute=e.target.value.trim();touch()};if($("#psv"))$("#psv").onchange=e=>{p.service=e.target.value.trim();touch()};
  if($("#psd"))$("#psd").onchange=e=>{const t=e.target.value.trim();if(!t){p.service_data=null;e.target.style.borderColor="";touch();return}try{p.service_data=JSON.parse(t);e.target.style.borderColor="";touch()}catch(x){e.target.style.borderColor="var(--bad)"}};
  if($("#psw"))$("#psw").onchange=e=>{p.service_when=e.target.value;touch()};
  if($("#ppu"))$("#ppu").onchange=e=>{e.target.checked?a.pulse=true:delete a.pulse;touch()};
  $("#pinv").onchange=e=>{e.target.checked?a.invert=true:delete a.invert;touch()};
  if($("#peq"))$("#peq").onchange=e=>{const t=e.target.value.trim();t===""?delete a.equals:a.equals=t;touch()};
  if($("#pfb"))$("#pfb").onchange=e=>{const t=e.target.value.trim();t===""?delete a.fallback:a.fallback=isNaN(Number(t))?t:Number(t);touch()};
  $("#psc").onchange=e=>{const t=e.target.value.trim(),k=isIn?"scale":"scale_out";if(!t){delete a[k];e.target.style.borderColor="";touch();return}
    try{const v=JSON.parse(t);if(!Array.isArray(v)||v.length!==4)throw 0;a[k]=v;e.target.style.borderColor="";touch()}catch(x){e.target.style.borderColor="var(--bad)"}};
  const d=el("button","pbtn d","Eliminar");d.onclick=delSel;b.appendChild(d);
}

/* ---------- menú contextual / avisos ---------- */
function showCtx(ev,items){const c=$("#ctx");c.innerHTML="";items.forEach(([l,f])=>{const d=el("div","",esc(l));d.onclick=()=>{hideCtx();f()};c.appendChild(d)});
  c.style.display="block";c.style.left=Math.min(ev.clientX,innerWidth-170)+"px";c.style.top=Math.min(ev.clientY,innerHeight-items.length*26-10)+"px"}
const hideCtx=()=>$("#ctx").style.display="none";addEventListener("mousedown",e=>{if(!$("#ctx").contains(e.target))hideCtx()});
function toast(t,bad){const e=$("#toast");e.textContent=t;e.className=bad?"bad":"";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)}

/* ---------- panel inferior ---------- */
function setBottomMin(m){$("#bottom").classList.toggle("min",m);$("#bmin").textContent=m?"▴":"▾"}
$("#bmin").onclick=()=>setBottomMin(!$("#bottom").classList.contains("min"));
document.querySelectorAll(".bt [data-b]").forEach(b=>b.onclick=()=>{bottomTab=b.dataset.b;setBottomMin(false);drawBottom()});
function drawBottom(){
  document.querySelectorAll(".bt [data-b]").forEach(b=>b.classList.toggle("on",b.dataset.b===bottomTab));const c=$("#bcont");
  if(bottomTab==="log")c.innerHTML=(live?.calls||[]).map(x=>`<div class="${x.sent?"sent":"sim"}">${esc(x.t)}  ${x.sent?"ENVIADO":"SIMULADO"}  ${esc(x.service)}  ${esc(JSON.stringify(x.data))}  <span style="color:var(--mute)">← ${esc(x.from)}</span></div>`).join("")||"<div>Aún no hay órdenes. En simulación se listan aquí sin enviarse a Home Assistant.</div>";
  else if(bottomTab==="msg")c.innerHTML=msgs.map(m=>`<div class="${m.bad?"er":""}">${esc(m.t)}  ${esc(m.m)}</div>`).join("")||"<div>Sin mensajes.</div>";
  else{const rows=[];S.nodes.forEach(n=>{const o=live?.out?.[n.id]||{};Object.entries(o).forEach(([k,v])=>rows.push(`<div>${esc(n.name||n.id)}.${esc(k)} = ${esc(typeof v==="object"?JSON.stringify(v):v)}</div>`))});c.innerHTML=rows.join("")||"<div>Sin datos.</div>"}
}

/* ---------- servidor ---------- */
async function poll(){
  try{live=await api("api/live");const ok=live.connected;$("#sdot").className="dot "+(ok?"ok":"bad");$("#sst").textContent=ok?"Home Assistant conectado":"Sin conexión con Home Assistant";
    $("#scyc").textContent="ciclos "+live.cycles;const m=$("#smode");m.className="mode "+(live.dry?"sim":"act");m.textContent=live.dry?"SIMULACIÓN":"ACTIVO";
    if(live.err&&live.err!==poll.le){msg(live.err,1)}poll.le=live.err;
    updateLive();if(bottomTab!=="msg")drawBottom();refreshRibbon()}
  catch(e){$("#sdot").className="dot bad";$("#sst").textContent="Servidor sin respuesta"}
}
async function refreshEnt(){try{ENT=await api("api/entities");drawTree();toast("Entidades actualizadas ("+ENT.length+")")}catch(e){toast(e.message,1)}}
async function save(){
  try{await api("api/project","PUT",toProject());dirty=false;$("#dirty").textContent="";refreshRibbon();toast("Guardado y desplegado");msg("Proyecto guardado y desplegado en el motor")}
  catch(e){toast("Error: "+e.message,1);msg("Error al guardar: "+e.message,1)}
}
async function toggleMode(){const toActive=live?.dry!==false;
  if(toActive&&!confirm("Modo ACTIVO: el motor empezará a llamar a servicios de Home Assistant (encender luces, mover persianas…). ¿Continuar?"))return;
  try{await api("api/mode","PUT",{active:toActive});msg(toActive?"Modo ACTIVO":"Modo SIMULACIÓN");poll()}catch(e){toast(e.message,1)}}
$("#smode").onclick=toggleMode;$("#stheme").onclick=toggleTheme;
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
addEventListener("resize",()=>{applyView()});

/* ---------- teclado ---------- */
addEventListener("keydown",ev=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName),c=ev.ctrlKey||ev.metaKey;
  if(c&&ev.key==="s"){ev.preventDefault();save();return}
  if(typing)return;
  if(c&&ev.key==="z"){ev.preventDefault();undo(ev.shiftKey?1:-1)}
  else if(c&&ev.key==="y"){ev.preventDefault();undo(1)}
  else if(c&&ev.key==="c"){copySel()} else if(c&&ev.key==="x"){copySel();delSel()} else if(c&&ev.key==="v"){paste()}
  else if(c&&ev.key==="a"){ev.preventDefault();selAll()} else if(c&&ev.key==="f"){ev.preventDefault();openSearch()} else if(c&&ev.key==="b"){ev.preventDefault();openPicker("bloque")}
  else if(ev.key==="Delete"||ev.key==="Backspace"){if(wsel>=0){S.wires.splice(wsel,1);wsel=-1;touch();fullRender()}else delSel()}
  else if(ev.key==="Escape"){closeModal();setSel([])}
  else if(ev.key==="f"&&!c){fit()}
  else if(sel.size&&ev.key.startsWith("Arrow")){ev.preventDefault();const d=ev.shiftKey?G*4:G,dx=ev.key==="ArrowLeft"?-d:ev.key==="ArrowRight"?d:0,dy=ev.key==="ArrowUp"?-d:ev.key==="ArrowDown"?d:0;
    [...sel].map(obj).forEach(o=>{o.x+=dx;o.y+=dy});touch();fullRender()}
});

/* ---------- redimensionar docks ---------- */
function splitter(id,varName,dir,min,max){const s=$(id);s.onmousedown=ev=>{ev.preventDefault();const sx=ev.clientX,w0=parseInt(getComputedStyle($("#main")).getPropertyValue(varName))||(dir>0?270:290);
  const mv=m=>{$("#main").style.setProperty(varName,Math.min(max,Math.max(min,w0+dir*(m.clientX-sx)))+"px");applyView()};
  const up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};addEventListener("mousemove",mv);addEventListener("mouseup",up)}}
splitter("#sl","--wl",1,180,520);splitter("#sr","--wr",-1,220,560);

/* ---------- arranque ---------- */
(async()=>{
  document.body.dataset.theme=lsGet("theme","light");drawTabs();drawRibbon();
  try{const [cat,proj,ent]=await Promise.all([api("api/catalog"),api("api/project"),api("api/entities")]);
    cat.forEach(b=>{applyUI(b);CAT[b.id]=b});ENT=ent;fromProject(proj);
    $("#pname").textContent="proyecto.json";msg(`Proyecto cargado: ${S.nodes.length} bloques, ${S.pn.length} objetos de periferia`)}
  catch(e){toast("No se pudo cargar: "+e.message,1);msg("No se pudo cargar: "+e.message,1)}
  pushHist();dirty=false;fullRender();applyView();fit();poll();setInterval(poll,1000);
  setInterval(async()=>{try{ENT=await api("api/entities");if(!$("#tsearch").value)drawTree()}catch(e){}},30000);
})();
